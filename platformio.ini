; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
monitor_filters = esp8266_exception_decoder, time, colorize
build_flags = 
	-Iinclude
	-Iinclude/glimmer
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	; TFT_eSPI setup for the HelloCubic / SmallTV ST7789 240x240 panel (CS tied to GND, hence -1)
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=-1
	-DTFT_DC=0
	-DTFT_RST=2
	-DTFT_BL=5
	-DTOUCH_CS=-1
	-DLOAD_GLCD=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
extra_scripts = pre:scripts/git_version.py
check_tool = clangtidy
; Code adapted from glimmer keeps its upstream style, so it is excluded from the style gate (see THIRD_PARTY.md)
check_src_filters = +<src/> +<include/> -<src/glimmer/> -<include/glimmer/>
check_flags = 
	clangtidy: --checks=-*,bugprone-*,modernize-*,readability-*,modernize-use-trailing-return-type,-bugprone-easily-swappable-parameters --warnings-as-errors=*
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	bodmer/TFT_eSPI@^2.5.43
	bitbank2/AnimatedGIF@^2.2.0
