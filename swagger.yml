openapi: "3.0.0"
info:
  title: "GeekMagic-Open-Firmware API"
  version: "1.0.0"
servers:
  - url: "http://{host}/"
    description: "API Server for version 1"
    variables:
      host:
        default: "localhost"
paths:
  /api/v1/wifi/scan:
    get:
      summary: "Scan available WiFi networks"
      operationId: "op_v1_get_api_v1_wifi_scan"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "WiFi"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Scan available WiFi networks. This endpoint requires a valid bearer token in the Authorization header."
  /api/v1/wifi/connect:
    post:
      summary: "Connect to a WiFi network"
      operationId: "op_v1_post_api_v1_wifi_connect"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "WiFi"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Connect to a WiFi network. This endpoint requires a valid bearer token in the Authorization header."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                ssid:
                  type: "string"
                password:
                  type: "string"
              required:
                - "ssid"
                - "password"
              example:
                ssid: "MyNetwork"
                password: "password123"
        required: true
  /api/v1/wifi/status:
    get:
      summary: "Get WiFi connection status"
      operationId: "op_v1_get_api_v1_wifi_status"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "WiFi"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Get WiFi connection status. This endpoint requires a valid bearer token in the Authorization header."
  /api/v1/ntp/sync:
    post:
      summary: "Trigger NTP sync"
      operationId: "op_v1_post_api_v1_ntp_sync"
      responses:
        200:
          description: ""
