        400:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        404:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "GIF"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Delete a GIF by name. This endpoint requires a valid bearer token in the Authorization header."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
              required:
