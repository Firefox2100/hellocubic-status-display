      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Which Claude/Codex credentials are set (never the values). This endpoint requires a valid bearer token in the Authorization header."
    post:
      summary: "Set or clear Claude/Codex credentials (write-only)"
      operationId: "op_v1_post_api_v1_credentials"
      responses:
        200:
