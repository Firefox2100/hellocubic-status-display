      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                title:
                  type: "string"
                kind:
                  type: "string"
                body:
                  type: "string"
                value:
                  type: "string"
                id:
                  type: "string"
                agent:
                  type: "string"
                project:
                  type: "string"
                progress:
                  type: "number"
                ttl_s:
                  type: "number"
                display:
                  type: "string"
                urgent:
                  type: "boolean"
              example:
                id: "tests"
                kind: "success"
                title: "TESTS PASSED"
                value: "142/142"
                agent: "claude"
                ttl_s: 120
