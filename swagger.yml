        - "Display"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Update display settings (partial update). This endpoint requires a valid bearer token in the Authorization header."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                mode:
                  type: "string"
                gif:
                  type: "string"
                interval_s:
                  type: "number"
                auto_rotate:
                  type: "boolean"
                clock_24h:
                  type: "boolean"
                user_name:
                  type: "string"
                pin_approvals:
                  type: "boolean"
                approval_ttl_min:
                  type: "number"
                timezone:
                  type: "string"
                show_claude:
                  type: "boolean"
                show_codex:
                  type: "boolean"
                show_trend:
                  type: "boolean"
                show_ai:
                  type: "boolean"
                show_info:
                  type: "boolean"
                refresh_min:
                  type: "number"
                claude_weekly_hero:
                  type: "boolean"
                codex_weekly_hero:
                  type: "boolean"
                tls_verify:
                  type: "boolean"
                show_weather:
                  type: "boolean"
                fahrenheit:
                  type: "boolean"
                weather_lat:
                  type: "number"
                weather_lon:
                  type: "number"
                weather_name:
                  type: "string"
                brightness:
                  type: "number"
              example:
                mode: "cycle"
                gif: "arch-i-use-arch-btw.gif"
                interval_s: 15
                user_name: "Patrick"
                timezone: "GMT0BST,M3.5.0/1,M10.5.0"
        required: true
