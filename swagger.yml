      summary: "Set NTP configuration"
      operationId: "op_v1_post_api_v1_ntp_config"
      responses:
        200:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        400:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
        401:
          description: ""
          content:
            application/json:
              schema:
                type: "object"
      tags:
        - "NTP"
      security:
        - bearerAuth: []
      description: "**Requires Authentication** - Set NTP configuration. This endpoint requires a valid bearer token in the Authorization header."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                ntp_server:
                  type: "string"
              required:
                - "ntp_server"
              example:
                ntp_server: "pool.ntp.org"
        required: true
  /api/v1/display/rotation:
